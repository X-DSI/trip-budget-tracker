name: deploy

# Two Firebase projects (docs/adr/2026-11-23-separate-dev-and-prod-projects.md):
# - pull requests → `preview` environment → dev project: rules + a Hosting preview channel
# - push to main  → `production` environment → prod project: rules + the live channel
#                  → `preview` environment → dev project's live channel too (dry runs)
# Each GitHub environment holds its own VITE_FIREBASE_* variables and FIREBASE_SERVICE_ACCOUNT
# secret. A job skips cleanly while its environment has no service account.
# Release freeze (docs/adr/2026-11-23-release-freeze-for-first-trip.md): merges to main go live.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      FIREBASE_PROJECT: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Skip without Firebase credentials
        if: env.HAS_FIREBASE_SA != 'true'
        run: echo "::notice::The preview environment has no FIREBASE_SERVICE_ACCOUNT; skipping."
      - name: Refuse to preview against production
        if: env.HAS_FIREBASE_SA == 'true' && env.FIREBASE_PROJECT == 'x-dsi-trip-budget'
        run: |
          echo "::error::The preview environment points at the production project. Set its VITE_FIREBASE_* variables to the dev project."
          exit 1
      - uses: actions/checkout@v5
        if: env.HAS_FIREBASE_SA == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_FIREBASE_SA == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_FIREBASE_SA == 'true'
        run: npm ci && npm run build
      - name: Deploy Firestore rules and indexes (dev)
        if: env.HAS_FIREBASE_SA == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy \
            --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_FIREBASE_SA == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          expires: 7d

  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      FIREBASE_PROJECT: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Skip without Firebase credentials
        if: env.HAS_FIREBASE_SA != 'true'
        run: echo "::notice::The production environment has no FIREBASE_SERVICE_ACCOUNT; skipping."
      - uses: actions/checkout@v5
        if: env.HAS_FIREBASE_SA == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_FIREBASE_SA == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_FIREBASE_SA == 'true'
        run: npm ci && npm run build
      - name: Deploy Firestore rules and indexes (prod)
        if: env.HAS_FIREBASE_SA == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy \
            --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_FIREBASE_SA == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          channelId: live

  # main also goes live on the dev project, so dry runs have a stable address
  # (https://x-dsi-trip-budget-dev.web.app) that never touches the real trip.
  dev-live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: preview
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      FIREBASE_PROJECT: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Skip without Firebase credentials
        if: env.HAS_FIREBASE_SA != 'true'
        run: echo "::notice::The preview environment has no FIREBASE_SERVICE_ACCOUNT; skipping."
      - name: Refuse to treat production as dev
        if: env.HAS_FIREBASE_SA == 'true' && env.FIREBASE_PROJECT == 'x-dsi-trip-budget'
        run: |
          echo "::error::The preview environment points at the production project."
          exit 1
      - uses: actions/checkout@v5
        if: env.HAS_FIREBASE_SA == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_FIREBASE_SA == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_FIREBASE_SA == 'true'
        run: npm ci && npm run build
      - name: Deploy Firestore rules and indexes (dev)
        if: env.HAS_FIREBASE_SA == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy \
            --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_FIREBASE_SA == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          channelId: live
