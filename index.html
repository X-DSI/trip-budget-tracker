<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <script>
      // Apply the saved theme before anything renders (src/lib/theme.ts keeps it in step).
      try {
        var p = localStorage.getItem('tbt.theme');
        var dark =
          p === 'dark' ||
          (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#020617');
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Plan a trip with other families, track expenses offline and split them fairly."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trip Budget" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Trip Budget</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
